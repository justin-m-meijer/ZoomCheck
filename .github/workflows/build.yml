name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.NOTARY_KEY != '' }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build universal app
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Set version from tag
        if: env.IS_RELEASE == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" build/ZoomCheck.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" build/ZoomCheck.app/Contents/Info.plist
          codesign --force --sign - build/ZoomCheck.app

      - name: Sign with Developer ID
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | awk -F'"' '{print $2}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No 'Developer ID Application' certificate found in MACOS_CERTIFICATE"
            exit 1
          fi
          codesign --force --options runtime --timestamp \
            --entitlements Resources/ZoomCheck.entitlements \
            --sign "$IDENTITY" build/ZoomCheck.app
          codesign --verify --strict --verbose=2 build/ZoomCheck.app

      - name: Notarize and staple
        if: env.HAS_SIGNING == 'true'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent build/ZoomCheck.app build/notarize.zip
          xcrun notarytool submit build/notarize.zip \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait
          rm "$RUNNER_TEMP/notary.p8" build/notarize.zip
          xcrun stapler staple build/ZoomCheck.app
          spctl --assess --type execute --verbose build/ZoomCheck.app

      - name: Package
        run: |
          NAME="ZoomCheck-${GITHUB_REF_NAME//\//-}"
          ditto -c -k --keepParent build/ZoomCheck.app "build/$NAME.zip"
          echo "ZIP=build/$NAME.zip" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoomCheck
          path: ${{ env.ZIP }}

      - name: Publish release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$HAS_SIGNING" == "true" ]]; then
            NOTES="Signed and notarized by Apple. Unzip, move ZoomCheck to Applications and open it."
          else
            NOTES="⚠️ Not notarized. macOS will block the first launch: open ZoomCheck once, then go to System Settings → Privacy & Security and click **Open Anyway**."
          fi
          gh release create "$GITHUB_REF_NAME" "$ZIP" --title "ZoomCheck $GITHUB_REF_NAME" --notes "$NOTES" --generate-notes
