name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version to publish as a GitHub Release (e.g. 0.1.0). Leave empty for a test build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.NOTARY_KEY != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine release version
        env:
          INPUT_RELEASE: ${{ github.event.inputs.release }}
        run: |
          VERSION=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_RELEASE" ]]; then
            VERSION="${INPUT_RELEASE#v}"
          fi
          if [[ -n "$VERSION" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must look like 1.2.3, got '$VERSION'"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build universal app
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Set app version
        if: env.VERSION != ''
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" build/ZoomCheck.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" build/ZoomCheck.app/Contents/Info.plist
          codesign --force --sign - build/ZoomCheck.app

      - name: Sign with Developer ID
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          # Apple's Developer ID intermediate, so the identity validates on the runner.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true

          security find-identity -p codesigning "$KEYCHAIN" | grep '"' | while read -r line; do echo "::notice title=Identity::$line"; done
          security find-certificate -a "$KEYCHAIN" | grep '"labl"' | while read -r line; do echo "::notice title=Certificate::$line"; done

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | awk -F'"' '{print $2}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No valid 'Developer ID Application' identity in MACOS_CERTIFICATE. See the list above for what the .p12 contains."
            exit 1
          fi
          codesign --force --options runtime --timestamp \
            --entitlements Resources/ZoomCheck.entitlements \
            --sign "$IDENTITY" build/ZoomCheck.app
          codesign --verify --strict --verbose=2 build/ZoomCheck.app
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Create DMG
        run: |
          if [[ -n "$VERSION" ]]; then NAME="ZoomCheck-v$VERSION"; else NAME="ZoomCheck-${GITHUB_REF_NAME//\//-}"; fi
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R build/ZoomCheck.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname ZoomCheck -srcfolder "$STAGE" -ov -format UDZO "build/$NAME.dmg"
          echo "DMG=build/$NAME.dmg" >> "$GITHUB_ENV"

      - name: Sign, notarize and staple DMG
        if: env.HAS_SIGNING == 'true'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait
          rm "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoomCheck
          path: ${{ env.DMG }}

      - name: Publish release
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$HAS_SIGNING" == "true" ]]; then
            NOTES="Signed and notarized by Apple. Open the DMG, drag ZoomCheck to Applications and open it."
          else
            NOTES="⚠️ Not notarized. macOS will block the first launch: open ZoomCheck once, then go to System Settings → Privacy & Security and click **Open Anyway**."
          fi
          gh release create "v$VERSION" "$DMG" --target "$GITHUB_SHA" --title "ZoomCheck v$VERSION" --notes "$NOTES" --generate-notes
